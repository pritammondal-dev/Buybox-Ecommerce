<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="100%" height="100%">
  <defs>
    <linearGradient id="roseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="50%" stop-color="#FFE4E6" />
      <stop offset="100%" stop-color="#FECDD3" />
    </linearGradient>
    <radialGradient id="roseGlow" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFE4E6" stop-opacity="0" />
    </radialGradient>
    <filter id="watchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#881337" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="200" fill="url(#roseBg)" />
  <rect width="480" height="200" fill="url(#roseGlow)" />

  <!-- Left Content -->
  <g transform="translate(32, 38)">
    <!-- Main Title -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#881337" letter-spacing="-0.4">
      Exclusive Brand Deals
    </text>

    <!-- Brands Subtitle -->
    <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#9F1239" opacity="0.95">
      Samsung | Apple | Dell &amp; More
    </text>

    <!-- CTA Button -->
    <g transform="translate(0, 72)">
      <rect width="112" height="34" rx="17" fill="#881337" />
      <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">
        Shop Now →
      </text>
    </g>
  </g>

  <!-- Smartwatch Graphic on Right -->
  <g transform="translate(395, 100)" filter="url(#watchShadow)">
    <!-- Top Strap -->
    <path d="M -18,-50 L -18,-92 L 18,-92 L 18,-50 Z" fill="#1E293B" rx="4" />
    <line x1="-14" y1="-75" x2="14" y2="-75" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <line x1="-14" y1="-65" x2="14" y2="-65" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Bottom Strap -->
    <path d="M -18,50 L -18,92 L 18,92 L 18,50 Z" fill="#1E293B" rx="4" />
    <line x1="-14" y1Client="65" x2="14" y2="65" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <line x1="-14" y1="75" x2="14" y2="75" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Watch Case (rounded rectangle) -->
    <rect x="-36" y="-48" width="72" height="96" rx="22" fill="#0F172A" stroke="#334155" stroke-width="3" />
    <!-- Metallic Bezel Highlight -->
    <rect x="-33" y="-45" width="66" height="90" rx="19" fill="#020617" />

    <!-- Crown Button on Right -->
    <rect x="36" y="-14" width="5" height="14" rx="2" fill="#475569" />
    <!-- Secondary Button on Right -->
    <rect x="36" y="8" width="4" height="18" rx="2" fill="#334155" />

    <!-- Screen Display -->
    <!-- Digital Time -->
    <text x="0" y="-12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="18" font-weight="900" fill="#FFFFFF">
      10:09
    </text>
    <text x="0" y="2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#F43F5E">
      WED 16
    </text>

    <!-- Activity Rings (concentric arcs) -->
    <circle cx="0" cy="22" r="14" fill="none" stroke="#334155" stroke-width="3" />
    <circle cx="0" cy="22" r="14" fill="none" stroke="#F43F5E" stroke-width="3" stroke-dasharray="70 20" stroke-linecap="round" />
    <circle cx="0" cy="22" r="9" fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="45 15" stroke-linecap="round" />
    <circle cx="0" cy="22" r="5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="20 10" stroke-linecap="round" />
  </g>
</svg>
