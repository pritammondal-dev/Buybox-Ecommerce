<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="100%" height="100%">
  <defs>
    <linearGradient id="mintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <filter id="gadgetShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#064E3B" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="420" height="280" rx="20" fill="url(#mintBg)" />

  <!-- Left Copy -->
  <g transform="translate(28, 48)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#047857" letter-spacing="1">
      TOP TRENDING TECH
    </text>
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#0F172A" letter-spacing="-0.5">
      Smart Gadgets
    </text>
    <text x="0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#059669">
      for a Smarter You
    </text>
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#475569">
      Best electronic accessories
    </text>

    <!-- Button -->
    <g transform="translate(0, 98)">
      <rect width="112" height="34" rx="17" fill="#007A55" />
      <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">
        Shop Now →
      </text>
    </g>
  </g>

  <!-- Gadgets Graphic on Right -->
  <g transform="translate(290, 140)" filter="url(#gadgetShadow)">
    <!-- Smartwatch -->
    <g transform="translate(-40, -10)">
      <rect x="-18" y="-45" width="36" height="90" rx="8" fill="#1E293B" />
      <rect x="-24" y="-30" width="48" height="60" rx="14" fill="#0F172A" stroke="#334155" stroke-width="2" />
      <rect x="-20" y="-26" width="40" height="52" rx="10" fill="#000000" />
      <text x="0" y="2" font-family="sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="middle">10:45</text>
      <circle cx="0" cy="14" r="3" fill="#F59E0B" />
    </g>

    <!-- Wireless Earbuds Case -->
    <g transform="translate(40, 20)">
      <ellipse cx="0" cy="0" rx="26" ry="34" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
      <ellipse cx="0" cy="-6" rx="22" ry="26" fill="#F8FAFC" />
      <circle cx="0" cy="14" r="2.5" fill="#10B981" />
    </g>

    <!-- Earbud Left -->
    <g transform="translate(18, -45) rotate(-15)">
      <ellipse cx="0" cy="0" rx="7" ry="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <rect x="-3" y="6" width="6" height="18" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    </g>
  </g>
</svg>
