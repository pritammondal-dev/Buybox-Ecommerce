<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="100%" height="100%">
  <defs>
    <linearGradient id="yellowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="50%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <radialGradient id="warmGlow" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0" />
    </radialGradient>
    <filter id="speakerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#78350F" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="200" fill="url(#yellowBg)" />
  <rect width="480" height="200" fill="url(#warmGlow)" />

  <!-- Left Content -->
  <g transform="translate(32, 42)">
    <!-- Title -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#1E293B" letter-spacing="-0.3">
      Smart Devices
    </text>
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#1E293B" letter-spacing="-0.3">
      for a Smarter Home
    </text>

    <!-- Text CTA Link -->
    <g transform="translate(0, 78)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#92400E" letter-spacing="0.2">
        Shop Now →
      </text>
      <line x1="0" y1="22" x2="88" y2="22" stroke="#92400E" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Smart Devices Illustration on Right -->
  <g transform="translate(390, 105)" filter="url(#speakerShadow)">
    <!-- Cylindrical Smart Speaker (tall) -->
    <g transform="translate(25, -5)">
      <!-- Body -->
      <rect x="-24" y="-55" width="48" height="90" rx="20" fill="#475569" />
      <rect x="-22" y="-53" width="44" height="86" rx="18" fill="#64748B" />
      <!-- Mesh Texture subtle lines -->
      <line x1="-18" y1="-30" x2="18" y2="-30" stroke="#334155" stroke-width="1" opacity="0.4" />
      <line x1="-18" y1="-10" x2="18" y2="-10" stroke="#334155" stroke-width="1" opacity="0.4" />
      <line x1="-18" y1="10" x2="18" y2="10" stroke="#334155" stroke-width="1" opacity="0.4" />
      <!-- Glowing Top LED Ring -->
      <ellipse cx="0" cy="-50" rx="18" ry="6" fill="#0EA5E9" opacity="0.9" />
      <ellipse cx="0" cy="-50" rx="12" ry="4" fill="#38BDF8" />
    </g>

    <!-- Spherical Smart Assistant (foreground left) -->
    <g transform="translate(-32, 10)">
      <circle cx="0" cy="0" r="32" fill="#E2E8F0" />
      <ellipse cx="0" cy="-10" rx="24" ry="12" fill="#F8FAFC" />
      <!-- Base glowing LED indicator -->
      <ellipse cx="0" cy="24" rx="20" ry="5" fill="#3B82F6" opacity="0.8" />
      <!-- Assistant logo accent -->
      <circle cx="-6" cy="-8" r="3" fill="#3B82F6" />
      <circle cx="0" cy="-8" r="3" fill="#EF4444" />
      <circle cx="6" cy="-8" r="3" fill="#F59E0B" />
    </g>
  </g>
</svg>
